name: PileupNativeTests
options:
  deploymentTarget:
    iOS: "16.4"
packages:
  PileupNative:
    path: ..
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  TestHost:
    type: application
    platform: iOS
    sources: [TestHost.swift]
    info:
      path: Info.plist
      properties:
        NSLocalNetworkUsageDescription: Discovery tests
        NSBonjourServices: [_pileup._tcp, _googlecast._tcp, _airplay._tcp, _pileuptest._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: Pileup native tests read and add test media
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glumpo.pileup.testhost
  PileupNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../Tests]
    dependencies:
      - target: TestHost
      - package: PileupNative
  PhotoAccessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [../UITests]
    dependencies:
      - target: TestHost
    settings:
      base:
        TEST_TARGET_NAME: TestHost
schemes:
  PileupNativeTests:
    build:
      targets:
        TestHost: all
        PileupNativeTests: [test]
        PhotoAccessUITests: [test]
    test:
      targets: [PileupNativeTests, PhotoAccessUITests]
