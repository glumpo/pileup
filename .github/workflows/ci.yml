name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: make check

  macos-runner-check:
    runs-on: macos-latest
    steps:
      - run: |
          uname -a
          sw_vers
