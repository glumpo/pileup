name: CI

on:
  push:
    branches-ignore: [ci-logs]

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI_LOGS: ${{ github.workspace }}/build/ci-logs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: scripts/ci-step.sh check make check
      - if: always()
        run: scripts/ci-logs.sh check "${{ job.status }}"

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI_LOGS: ${{ github.workspace }}/build/ci-logs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: scripts/ci-step.sh env sh -c 'echo "$ANDROID_HOME"; ls "$ANDROID_HOME/ndk"; java -version; go version; df -h .'
      - run: scripts/ci-step.sh android-debug make android-debug
      - run: scripts/ci-step.sh android-test make android-test
      - if: always()
        run: scripts/ci-logs.sh android "${{ job.status }}"

  ios-native:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      CI_LOGS: ${{ github.workspace }}/build/ci-logs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: scripts/ci-step.sh env sh -c 'sw_vers; uname -m; sysctl -n hw.ncpu; ls -d /Applications/Xcode*; xcodebuild -version; xcodebuild -showsdks; xcrun simctl list devices available; go version; df -h .'
      - run: scripts/ci-step.sh ios-boot make ios-boot
      - run: scripts/ci-step.sh mobile-ios make mobile-ios
      - run: scripts/ci-step.sh ios-test make ios-test IOS_REQUIRE_PHOTOS=1
      - if: always()
        run: scripts/ci-logs.sh ios-native "${{ job.status }}"

  ios-app:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      CI_LOGS: ${{ github.workspace }}/build/ci-logs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: scripts/ci-step.sh ios-boot make ios-boot
      - run: scripts/ci-step.sh mobile-ios make mobile-ios
      - run: scripts/ci-step.sh ios-prebuild make ios-prebuild
      - run: scripts/ci-step.sh ios-build make ios-build
      - run: scripts/ci-step.sh ios-smoke make ios-smoke
      - run: scripts/ci-step.sh ios-device make ios-device
      - if: always()
        run: scripts/ci-step.sh sizes scripts/ios-sizes.sh
      - if: always()
        run: |
          cp build/ios-smoke/*.png "$CI_LOGS" || true
          scripts/ci-logs.sh ios-app "${{ job.status }}"
