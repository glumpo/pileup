openapi: 3.1.0
info:
  title: Pileup core API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "8080"
security:
  - bearer: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the core is running
      responses:
        "200":
          description: Core is running.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
        "401":
          description: Missing or invalid token.
  /piles:
    get:
      operationId: listPiles
      summary: List piles this device is a member of
      responses:
        "200":
          description: Piles in creation and join order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pile"
        "401":
          description: Missing or invalid token.
    post:
      operationId: createPile
      summary: Create a pile with this device as its first member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - member
              properties:
                name:
                  type: string
                member:
                  type: string
                  description: Name of this device's member.
      responses:
        "201":
          description: Pile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pile"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: Missing or invalid token.
  /piles/{id}/invite:
    get:
      operationId: getInvite
      summary: Get the invite string to show as a QR code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]+$"
      responses:
        "200":
          description: Invite with the pile id, its secret and this device's addresses.
          content:
            application/json:
              schema:
                type: object
                required:
                  - invite
                properties:
                  invite:
                    type: string
                    pattern: "^PILEUP:[A-Z2-7]+$"
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /piles/join:
    post:
      operationId: joinPile
      summary: Join a pile by a scanned invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invite
                - member
              properties:
                invite:
                  type: string
                member:
                  type: string
                  description: Name of this device's member.
      responses:
        "201":
          description: Joined; name and members arrive as the pile syncs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pile"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: Missing or invalid token.
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /piles/{id}/blob/{asset}/{revision}/{tier}:
    get:
      operationId: getBlob
      summary: Get a thumbnail (T1) or display version (T2) of a pile asset
      description: >-
        Served from this device's blob store; a missing blob is generated
        (own asset) or fetched from the asset owner on demand. T1 of all pile
        assets is fetched in the background. Supports Range, If-None-Match.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]+$"
        - name: asset
          in: path
          required: true
          description: asset_id, hex.
          schema:
            type: string
            pattern: "^[0-9a-f]+$"
        - name: revision
          in: path
          required: true
          description: Current revision of the asset, hex.
          schema:
            type: string
            pattern: "^[0-9a-f]+$"
        - name: tier
          in: path
          required: true
          schema:
            type: integer
            enum:
              - 1
              - 2
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Blob content.
          headers:
            ETag:
              description: Quoted SHA-256 of the content, hex.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: max-age=31536000, immutable
          content:
            image/*:
              schema:
                type: string
                format: binary
        "206":
          description: Requested range of the blob.
        "304":
          description: Not modified (If-None-Match matched the ETag).
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
        "416":
          description: Range not satisfiable.
        "502":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Pile:
      type: object
      required:
        - id
        - name
        - members
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]+$"
        name:
          type: string
        members:
          type: array
          items:
            type: object
            required:
              - name
              - platform
            properties:
              name:
                type: string
              platform:
                type: string
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string
                enum:
                  - bad_request
                  - bad_invite
                  - unknown_invite_version
                  - unknown_pile
                  - already_joined
                  - inviter_unreachable
                  - offline
                  - unknown_asset
                  - source_unavailable
                  - internal
