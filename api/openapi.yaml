openapi: 3.1.0
info:
  title: Pileup core API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "8080"
security:
  - bearer: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the core is running
      responses:
        "200":
          description: Core is running.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
        "401":
          description: Missing or invalid token.
  /piles:
    get:
      operationId: listPiles
      summary: List piles this device is a member of
      responses:
        "200":
          description: Piles in creation and join order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pile"
        "401":
          description: Missing or invalid token.
    post:
      operationId: createPile
      summary: Create a pile with this device as its first member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - member
              properties:
                name:
                  type: string
                member:
                  type: string
                  description: Name of this device's member.
      responses:
        "201":
          description: Pile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pile"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: Missing or invalid token.
  /piles/{id}/invite:
    get:
      operationId: getInvite
      summary: Get the invite string to show as a QR code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]+$"
      responses:
        "200":
          description: Invite with the pile id, its secret and this device's addresses.
          content:
            application/json:
              schema:
                type: object
                required:
                  - invite
                properties:
                  invite:
                    type: string
                    pattern: "^PILEUP:[A-Z2-7]+$"
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /piles/join:
    post:
      operationId: joinPile
      summary: Join a pile by a scanned invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invite
                - member
              properties:
                invite:
                  type: string
                member:
                  type: string
                  description: Name of this device's member.
      responses:
        "201":
          description: Joined; name and members arrive as the pile syncs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pile"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: Missing or invalid token.
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /piles/{id}/selection:
    parameters:
      - $ref: "#/components/parameters/PileID"
    get:
      operationId: getSelection
      summary: List this device's media in the selected date range
      responses:
        "200":
          description: Range and its media; selected ones are published to the pile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Selection"
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
    put:
      operationId: setSelection
      summary: Choose the date range to contribute and publish the difference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from
                - to
              properties:
                from:
                  type: integer
                  format: int64
                  description: Start of taken_at range, UTC ms, inclusive.
                to:
                  type: integer
                  format: int64
                  description: End of taken_at range, UTC ms, exclusive.
      responses:
        "204":
          description: Range saved; screenshots and hidden albums are excluded unless chosen manually.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /piles/{id}/selection/{asset}:
    parameters:
      - $ref: "#/components/parameters/PileID"
      - name: asset
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]+$"
    put:
      operationId: setAssetSelected
      summary: Exclude a file from the pile or bring it back
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - selected
              properties:
                selected:
                  type: boolean
      responses:
        "204":
          description: Decision saved and published.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /piles/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/PileID"
    get:
      operationId: getTimeline
      summary: List all pile assets in timeline order
      description: >-
        Order is (taken_at, author, asset_id), the same on every member's
        device. Days are not part of the model; the UI may draw day separators
        by taken_at + local_offset. The response carries an ETag; a request
        with If-None-Match equal to it gets 304 while the pile is unchanged.
      responses:
        "200":
          description: Assets of all members in timeline order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineItem"
        "304":
          description: Timeline is unchanged since the ETag in If-None-Match.
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
  /piles/{id}/blob/{asset}/{revision}/{tier}:
    get:
      operationId: getBlob
      summary: Get a thumbnail (T1) or display version (T2) of a pile asset
      description: >-
        Served from this device's blob store; a missing blob is generated
        (own asset) or fetched from the asset owner on demand. T1 of all pile
        assets is fetched in the background. Supports Range, If-None-Match.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]+$"
        - name: asset
          in: path
          required: true
          description: asset_id, hex.
          schema:
            type: string
            pattern: "^[0-9a-f]+$"
        - name: revision
          in: path
          required: true
          description: Current revision of the asset, hex.
          schema:
            type: string
            pattern: "^[0-9a-f]+$"
        - name: tier
          in: path
          required: true
          schema:
            type: integer
            enum:
              - 1
              - 2
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Blob content.
          headers:
            ETag:
              description: Quoted SHA-256 of the content, hex.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: max-age=31536000, immutable
          content:
            image/*:
              schema:
                type: string
                format: binary
        "206":
          description: Requested range of the blob.
        "304":
          description: Not modified (If-None-Match matched the ETag).
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
        "416":
          description: Range not satisfiable.
        "502":
          $ref: "#/components/responses/Error"
        "507":
          $ref: "#/components/responses/Error"
  /piles/{id}/pins:
    parameters:
      - $ref: "#/components/parameters/PileID"
    get:
      operationId: getPins
      summary: Progress of loading pinned display versions (T2), per member
      description: >-
        Pinned files are T2 (display versions and video posters) loaded by
        «Загрузить всё с участника» and «Загрузить вообще всё». They are kept
        on this device and never evicted from the cache until unpinned, even
        over the budget; pins survive restarts. Loading goes on in the
        background with or without a show, in timeline order from the show
        cursor (from the start without a show), at most 5 requests per
        member together with the show prefetch. Video originals are never
        loaded.
      responses:
        "200":
          $ref: "#/components/responses/PinProgress"
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: pin
      summary: Pin and load all T2 of a member, or of the whole pile
      description: >-
        Pins every file of the member (all files without member) that is in
        the pile now; files added later are not pinned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member:
                  type: string
                  pattern: "^[0-9a-f]+$"
                  description: Author of the member; the whole pile if absent.
      responses:
        "200":
          $ref: "#/components/responses/PinProgress"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: Missing or invalid token.
        "404":
          description: unknown_pile or unknown_member.
          $ref: "#/components/responses/Error"
    delete:
      operationId: unpin
      summary: Unpin files of a member, or all pinned files of the pile
      description: >-
        Unpinned files stay in the cache until the budget evicts them
        (earliest taken_at first).
      parameters:
        - name: member
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9a-f]+$"
          description: Author of the member; all pins of the pile if absent.
      responses:
        "200":
          $ref: "#/components/responses/PinProgress"
        "401":
          description: Missing or invalid token.
        "404":
          description: unknown_pile or unknown_member.
          $ref: "#/components/responses/Error"
  /piles/{id}/pins/estimate:
    parameters:
      - $ref: "#/components/parameters/PileID"
    get:
      operationId: estimatePins
      summary: What pinning a member or the whole pile would load
      description: >-
        Sizes of T2 are unknown before loading, so the estimate takes the
        average size of T2 of this pile already on the device, or 400 KiB if
        there are none.
      parameters:
        - name: member
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9a-f]+$"
          description: Author of the member; the whole pile if absent.
      responses:
        "200":
          description: Estimate.
          content:
            application/json:
              schema:
                type: object
                required:
                  - files
                  - missing
                  - estimated_bytes
                  - budget_bytes
                  - free_bytes
                  - over_budget
                properties:
                  files:
                    type: integer
                    description: Files of the member (of the pile), videos count by their poster.
                  missing:
                    type: integer
                    description: Of them, not loaded yet.
                  estimated_bytes:
                    type: integer
                    format: int64
                    description: Estimated size of the missing files.
                  budget_bytes:
                    type: integer
                    format: int64
                    description: Cache budget of this device for the pile.
                  free_bytes:
                    type:
                      - integer
                      - "null"
                    format: int64
                    description: Free space on the device's data volume; null if unknown.
                  over_budget:
                    type: boolean
                    description: >-
                      Already pinned files plus these would not fit in the
                      budget; warn the user before pinning. Pinned files are
                      loaded and kept anyway.
        "401":
          description: Missing or invalid token.
        "404":
          description: unknown_pile or unknown_member.
          $ref: "#/components/responses/Error"
  /screens:
    get:
      operationId: listScreens
      summary: List screens found in the local network
      description: >-
        Google Cast (_googlecast._tcp) and AirPlay (_airplay._tcp) receivers
        currently seen by mDNS, ordered by name. A screen this device cannot
        show on is still listed, with the reason.
      responses:
        "200":
          description: Screens in the local network.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Screen"
        "401":
          description: Missing or invalid token.
  /diag:
    get:
      operationId: getDiag
      summary: List this device's diagnostic events, newest first
      description: >-
        Local only, never replicated. A bounded ring buffer: the oldest events
        are dropped. A repeat of an event (same kind, pile, peer and message)
        increments its count, takes the new time and moves to the top.
      responses:
        "200":
          description: Diagnostic events, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiagEvent"
        "401":
          description: Missing or invalid token.
  /diag/export:
    get:
      operationId: exportDiag
      summary: Export the diagnostic log as a text file for a bug report
      description: >-
        One event per line, oldest first: UTC time, kind, pile=<hex> and
        peer=<peer> if present, x<count> if repeated, message.
      responses:
        "200":
          description: The diagnostic log.
          headers:
            Content-Disposition:
              schema:
                type: string
                const: attachment; filename="pileup-diag.txt"
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid token.
  /reconnect:
    post:
      operationId: reconnect
      summary: Retry the connections to all known peer addresses now
      description: >-
        Connection loops that wait for their next retry try at once, and every
        saved peer address without a loop gets a new one. The app calls this
        when it returns to the foreground. The reconnect and its reason are
        written to the diagnostic log.
      responses:
        "204":
          description: Retries started.
        "401":
          description: Missing or invalid token.
  /show:
    post:
      operationId: startShow
      summary: Start a show of a pile on a screen, with this device as the host
      description: >-
        One show per host: a running show is stopped first. The session lives
        only on this device. On a Cast screen the host connects to the Default
        Media Receiver, serves media to it over plain HTTP in the local network
        under a token valid until the show stops, and loads the current file
        on every cursor change; T2 of the cursor, the next 20 files and then
        the 5 files before the cursor is prefetched from their owners into
        the cache of the pile, which
        outlives the show (see /piles/{id}/pins). An AirPlay screen is
        available only on an iPhone host, where the app renders it natively.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pile
                - screen
              properties:
                pile:
                  type: string
                  pattern: "^[0-9a-f]+$"
                screen:
                  type: string
                  description: Screen id from GET /screens.
                asset:
                  type: string
                  pattern: "^[0-9a-f]+$"
                  description: File to start from; the first file of the timeline if absent.
      responses:
        "201":
          description: The show is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowState"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: Missing or invalid token.
        "404":
          description: unknown_pile, unknown_screen or unknown_asset.
          $ref: "#/components/responses/Error"
        "409":
          description: >-
            screen_unavailable (with reason to show as is) or empty_pile.
          $ref: "#/components/responses/Error"
        "502":
          description: screen_unreachable — could not connect to the screen.
          $ref: "#/components/responses/Error"
    get:
      operationId: getShow
      summary: State of the running show
      responses:
        "200":
          description: Show state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowState"
        "401":
          description: Missing or invalid token.
        "404":
          description: no_show.
          $ref: "#/components/responses/Error"
    delete:
      operationId: stopShow
      summary: Stop the running show, if any
      description: Stops playback on the screen and revokes the screen's token.
      responses:
        "204":
          description: No show is running.
        "401":
          description: Missing or invalid token.
  /show/next:
    post:
      operationId: showNext
      summary: Move to the next file; stays on the last one
      responses:
        "200":
          $ref: "#/components/responses/ShowState"
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
  /show/prev:
    post:
      operationId: showPrev
      summary: Move to the previous file; stays on the first one
      responses:
        "200":
          $ref: "#/components/responses/ShowState"
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
  /show/goto:
    post:
      operationId: showGoto
      summary: Move to a file of the pile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset
              properties:
                asset:
                  type: string
                  pattern: "^[0-9a-f]+$"
      responses:
        "200":
          $ref: "#/components/responses/ShowState"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          description: Missing or invalid token.
        "404":
          description: no_show or unknown_asset.
          $ref: "#/components/responses/Error"
  /show/play:
    post:
      operationId: showPlay
      summary: Resume the current video
      responses:
        "200":
          $ref: "#/components/responses/ShowState"
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: not_video.
          $ref: "#/components/responses/Error"
  /show/pause:
    post:
      operationId: showPause
      summary: Pause the current video
      responses:
        "200":
          $ref: "#/components/responses/ShowState"
        "401":
          description: Missing or invalid token.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: not_video.
          $ref: "#/components/responses/Error"
components:
  parameters:
    PileID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]+$"
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Pile:
      type: object
      required:
        - id
        - name
        - members
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]+$"
        name:
          type: string
        members:
          type: array
          items:
            type: object
            required:
              - key
              - name
              - platform
              - app_version
              - online
              - last_seen
            properties:
              key:
                type: string
                pattern: "^[0-9a-f]+$"
                description: >-
                  Device key of the member, as author of timeline items and
                  hints.
              name:
                type: string
              platform:
                type: string
              app_version:
                type: string
                description: >-
                  Version of the app that created the member's Join, as of
                  joining; empty when the Join carries no version.
              online:
                type: boolean
                description: >-
                  A sync connection to the member is up now. This device is
                  always online for itself.
              last_seen:
                type:
                  - integer
                  - "null"
                description: >-
                  Unix ms of the last moment the member was connected: now
                  while online, the end of the last connection otherwise;
                  null if not connected since the core started. Not saved
                  across restarts.
              last_error:
                type: string
                description: >-
                  Present only while offline: why the member cannot be
                  reached, from the last attempt at each of its known
                  addresses. refused — nothing listens at the address
                  (Pileup is closed); timeout — no answer in time (the
                  phone sleeps or is busy); no_route — no route to the
                  address (not in this network); other_device — another
                  device or another pile answers at the address; error —
                  any other failure; no_address — no address of the member
                  is known. With several addresses the first class of
                  refused, timeout, no_route, other_device, error wins;
                  absent while the first attempts are still running. Newer
                  versions may add others.
    TimelineItem:
      type: object
      required:
        - id
        - revision
        - author
        - author_name
        - kind
        - taken_at
        - width
        - height
        - thumbhash
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]+$"
          description: asset_id, hex.
        revision:
          type: string
          pattern: "^[0-9a-f]+$"
          description: Current revision, hex; part of the blob URL.
        author:
          type: string
          pattern: "^[0-9a-f]+$"
          description: Public key of the asset owner, hex.
        author_name:
          type: string
          description: Member name of the owner.
        kind:
          type: string
          description: photo, video or live_photo; newer versions may add others.
        taken_at:
          type: integer
          format: int64
          description: UTC ms.
        local_offset:
          type: integer
          format: int32
          description: Time zone offset at capture in seconds, if known.
        duration_ms:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        thumbhash:
          type: string
          contentEncoding: base64
          description: ThumbHash placeholder; empty if the owner has none.
    Screen:
      type: object
      required:
        - id
        - name
        - kind
        - address
        - available
      properties:
        id:
          type: string
          description: Opaque, unique among listed screens.
        name:
          type: string
          description: Name shown to the user.
        kind:
          type: string
          enum:
            - cast
            - airplay
        address:
          type: string
          description: host:port of the receiver.
        available:
          type: boolean
          description: Whether this device can show on the screen.
        reason:
          type: string
          description: >-
            Present when not available: why and what to do, in Russian, for
            the UI to show as is. AirPlay is available only on an iPhone host.
    DiagEvent:
      type: object
      required:
        - time
        - kind
        - message
        - count
      properties:
        time:
          type: integer
          format: int64
          description: UTC ms of the latest occurrence.
        kind:
          type: string
          description: >-
            discovery, connection, sync, timeout, renderer, media or api
            (a request answered with 500 or 507: route pattern and error
            text); newer versions may add others.
        pile:
          type: string
          pattern: "^[0-9a-f]+$"
          description: Pile id, if the event belongs to a pile.
        peer:
          type: string
          description: >-
            Peer address (host:port or host), or the owner's public key in hex
            for blob fetches, if the event concerns a peer.
        message:
          type: string
        count:
          type: integer
          minimum: 1
          description: How many times the event occurred.
    Selection:
      type: object
      required:
        - from
        - to
        - assets
      properties:
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        assets:
          type: array
          items:
            type: object
            required:
              - id
              - local_id
              - kind
              - taken_at
              - original_name
              - screenshot
              - hidden
              - selected
            properties:
              id:
                type: string
                pattern: "^[0-9a-f]+$"
              local_id:
                type: string
                description: Platform id of the file; never leaves this device.
              kind:
                type: string
                enum:
                  - photo
                  - video
                  - live_photo
              taken_at:
                type: integer
                format: int64
              original_name:
                type: string
              screenshot:
                type: boolean
              hidden:
                type: boolean
                description: The file is in a hidden album.
              selected:
                type: boolean
                description: Published to the pile.
    ShowItem:
      type: object
      required:
        - id
        - revision
        - author
        - kind
        - taken_at
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]+$"
        revision:
          type: string
          pattern: "^[0-9a-f]+$"
        author:
          type: string
          pattern: "^[0-9a-f]+$"
          description: Public key of the owner, hex; matches author in the timeline.
        kind:
          type: string
          description: photo, video or live_photo; newer versions may add others.
        taken_at:
          type: integer
          format: int64
    ShowState:
      type: object
      required:
        - pile
        - screen
        - index
        - total
        - current
        - playing
        - video_unavailable
        - waiting
        - hints
      properties:
        pile:
          type: string
          pattern: "^[0-9a-f]+$"
        screen:
          $ref: "#/components/schemas/Screen"
        index:
          type: integer
          description: Position of the current file in the timeline, from 0.
        total:
          type: integer
        current:
          $ref: "#/components/schemas/ShowItem"
        playing:
          type: boolean
          description: The current file is a video that is playing.
        video_unavailable:
          type: boolean
          description: >-
            The current file is a video whose owner is not answering; the
            screen shows its poster (T2) instead, hints name the owner. The
            show goes on with next; play retries the video once the owner is
            back.
        renderer_error:
          type: object
          description: >-
            Last error of the screen, until the next successful load or
            command. reconnecting: the connection to the Cast screen is lost
            and the host connects to the same screen again with pauses of 1,
            2, 4 … 30 s until the show stops; then the screen loads the
            current file and the error clears. Restarting the show (POST
            /show with the current file) stays a fallback.
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: >-
                load_failed, command_failed, playback_failed or reconnecting;
                newer versions may add others.
            message:
              type: string
              description: Technical details in English.
        waiting:
          type: array
          description: >-
            Files of the prefetch window not loaded yet because their owner is
            offline or not answering, in timeline order.
          items:
            $ref: "#/components/schemas/ShowItem"
        hints:
          type: array
          description: >-
            Members the show waits for: owners of waiting files and of an
            unavailable current video, in timeline order. The UI words them
            with advice by last_error, e.g. «Нет ответа от iPhone: Аня.
            Pileup закрыт — попросите открыть Pileup» with «Загрузить всё с
            участника» (POST /piles/{id}/pins). While the owner of the current
            file is among them, the UI shows its hint instead of load_failed.
            A member whose files wait is also logged in /diag as kind timeout.
          items:
            $ref: "#/components/schemas/Hint"
    Hint:
      type: object
      required:
        - author
        - name
        - platform
        - reason
      properties:
        author:
          type: string
          pattern: "^[0-9a-f]+$"
        name:
          type: string
          description: Member name in the pile.
        platform:
          type: string
          description: ios or android, as the member's device reported it.
        reason:
          type: string
          description: >-
            unreachable — no connection to the member's device; timeout —
            connected, but requests to it fail or time out; disk_full — the
            hint is about this device (author is its own key): its disk is
            full and loading stopped. Newer versions may add others.
        last_error:
          type: string
          description: >-
            Why the member cannot be reached, as last_error of the member in
            GET /piles; the UI picks its advice by it. Absent while the
            member is online.
    PinProgress:
      type: object
      required:
        - author
        - name
        - platform
        - total
        - done
        - failed
      properties:
        author:
          type: string
          pattern: "^[0-9a-f]+$"
        name:
          type: string
        platform:
          type: string
        total:
          type: integer
          description: Pinned files of the member.
        done:
          type: integer
          description: Of them, loaded.
        failed:
          type: integer
          description: >-
            Of them, failed with a permanent error (the owner has no such
            file or cannot render it); retried 5 minutes after the error,
            and counted here until then.
        reason:
          type: string
          description: >-
            Present while files remain and the member is not answering:
            unreachable or timeout, as in Hint; disk_full while files remain
            and this device's disk is full.
  responses:
    PinProgress:
      description: Members with pinned files, by name.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PinProgress"
    ShowState:
      description: Show state after the command.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ShowState"
    Error:
      description: >-
        Request failed. 500 (internal, media_failed, render_failed) and 507
        (disk_full) are written to the diagnostics log with the route and
        the error text.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              reason:
                type: string
                description: With screen_unavailable, the screen's reason to show as is.
              error:
                type: string
                enum:
                  - bad_request
                  - bad_invite
                  - unknown_invite_version
                  - unknown_pile
                  - already_joined
                  - inviter_unreachable
                  - offline
                  - unknown_asset
                  - no_media
                  - source_unavailable
                  - source_failed
                  - render_failed
                  - media_failed
                  - disk_full
                  - no_show
                  - unknown_screen
                  - screen_unavailable
                  - empty_pile
                  - not_video
                  - screen_unreachable
                  - unknown_member
                  - internal
